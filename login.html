<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#0b0f19; }
</style>
</head>

<body class="flex items-center justify-center min-h-screen text-white">

<div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl shadow-xl">

  <!-- LOGO -->
  <h1 class="text-2xl font-bold text-center text-cyan-400 mb-2">
    ERP Pro
  </h1>
  <p class="text-center text-gray-400 mb-6">
    Login to your account
  </p>

  <!-- FORM -->
  <div>

    <input id="email" type="email" placeholder="Email"
      class="w-full p-3 mb-3 rounded bg-gray-800 border border-gray-700 focus:border-cyan-400 outline-none">

    <input id="password" type="password" placeholder="Password"
      class="w-full p-3 mb-3 rounded bg-gray-800 border border-gray-700 focus:border-cyan-400 outline-none">

    <!-- ERROR -->
    <div id="error" class="text-red-400 text-sm mb-2 hidden"></div>

    <!-- BUTTON -->
    <button onclick="submitForm()"
      class="w-full bg-cyan-500 hover:bg-cyan-600 text-black font-semibold p-3 rounded">
      Login
    </button>

  </div>

  <!-- LINKS -->
  <div class="flex justify-between mt-4 text-sm">
    <button onclick="toggleMode()" class="text-cyan-400">
      Create account
    </button>

    <a href="forgot.html" class="text-gray-400 hover:text-white">
      Forgot?
    </a>
  </div>

</div>

<script>

// 🔗 CHANGE THIS
const API = "https://your-api.onrender.com";

let isSignup = false;

// TOGGLE MODE
function toggleMode(){
  isSignup = !isSignup;

  document.querySelector("h1").innerText =
    isSignup ? "Create Account" : "ERP Pro";

  document.querySelector("p").innerText =
    isSignup ? "Sign up to get started" : "Login to your account";

  document.querySelector("button").innerText =
    isSignup ? "Sign Up" : "Login";
}

// SUBMIT
async function submitForm(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("error");

  errorBox.classList.add("hidden");

  try {

    const url = isSignup ? "/auth/signup" : "/auth/login";

    const res = await fetch(API + url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(!data.success){
      throw new Error(data.message || "Login failed");
    }

    // SAVE TOKEN
    localStorage.setItem("token", data.token);

    // REDIRECT
    window.location.href = "index.html";

  } catch(err){
    errorBox.innerText = err.message;
    errorBox.classList.remove("hidden");
  }
}

</script>

</body>
</html>

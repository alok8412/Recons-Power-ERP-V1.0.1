<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP SaaS Pro</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#0b0f19; }
</style>
</head>

<body class="text-gray-200">

<div class="flex h-screen">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-gray-900 p-4 hidden md:block">
    <h1 class="text-xl font-bold mb-6 text-cyan-400">ERP Pro</h1>

    <nav class="space-y-2">
      <button onclick="show('dashboard')" class="w-full text-left hover:bg-gray-800 p-2 rounded">Dashboard</button>
      <button onclick="show('users')" class="w-full text-left hover:bg-gray-800 p-2 rounded">Users</button>
      <button onclick="show('reports')" class="w-full text-left hover:bg-gray-800 p-2 rounded">Reports</button>
      <button onclick="show('billing')" class="w-full text-left hover:bg-gray-800 p-2 rounded">Billing</button>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col">

    <!-- TOPBAR -->
    <header class="bg-gray-900 p-4 flex justify-between items-center">
      <h2 class="text-lg font-semibold">Dashboard</h2>
      <div class="text-sm">Admin</div>
    </header>

    <!-- CONTENT -->
    <main class="p-6 overflow-auto">

      <!-- DASHBOARD -->
      <div id="dashboard" class="page">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

          <div class="bg-gray-800 p-4 rounded-xl">
            <div class="text-gray-400">Revenue</div>
            <div class="text-2xl font-bold text-cyan-400">₹1,25,000</div>
          </div>

          <div class="bg-gray-800 p-4 rounded-xl">
            <div class="text-gray-400">GST</div>
            <div class="text-2xl font-bold text-green-400">₹18,000</div>
          </div>

          <div class="bg-gray-800 p-4 rounded-xl">
            <div class="text-gray-400">Users</div>
            <div class="text-2xl font-bold text-yellow-400">32</div>
          </div>

        </div>

        <div class="bg-gray-800 p-4 rounded-xl">
          <h3 class="mb-4">Recent Activity</h3>
          <p class="text-gray-400">No recent activity</p>
        </div>

      </div>

      <!-- USERS -->
      <div id="users" class="page hidden">

        <h2 class="text-xl mb-4">Users</h2>

        <div class="bg-gray-800 rounded-xl overflow-hidden">

          <table class="w-full text-left">
            <thead class="bg-gray-700 text-sm">
              <tr>
                <th class="p-3">Name</th>
                <th>Plan</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="userTable">
            </tbody>

          </table>

        </div>

      </div>

      <!-- REPORTS -->
      <div id="reports" class="page hidden">
        <h2 class="text-xl mb-4">Reports</h2>

        <div class="bg-gray-800 p-4 rounded-xl">
          <button class="bg-cyan-500 px-4 py-2 rounded">Generate P&L</button>
        </div>
      </div>

      <!-- BILLING -->
      <div id="billing" class="page hidden">
        <h2 class="text-xl mb-4">Billing</h2>

        <div class="bg-gray-800 p-4 rounded-xl">
          <p>Current Plan: Business</p>
          <button class="mt-2 bg-green-500 px-4 py-2 rounded">Upgrade</button>
        </div>
      </div>

    </main>
  </div>
</div>

<script>

// NAVIGATION
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// SAMPLE USERS
let users = [
  {name:"Ravi",plan:"Starter",status:"Active"},
  {name:"Amit",plan:"Business",status:"Active"},
  {name:"Neha",plan:"Free",status:"Blocked"}
];

function renderUsers(){
  userTable.innerHTML = users.map(u=>`
    <tr class="border-t border-gray-700">
      <td class="p-3">${u.name}</td>
      <td>${u.plan}</td>
      <td>${u.status}</td>
      <td><button class="text-cyan-400">Edit</button></td>
    </tr>
  `).join('');
}

renderUsers();

</script>

</body>
</html>

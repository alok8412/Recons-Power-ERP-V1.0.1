<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ERP Pro Final</title>
<style>
body{font-family:Arial;background:#0b0f19;color:#fff;margin:0}
.sidebar{width:200px;position:fixed;height:100%;background:#111;padding:10px}
.main{margin-left:210px;padding:20px}
button{padding:6px 10px;margin:5px}
input,select{padding:6px;margin:5px}
.card{background:#1a2235;padding:10px;margin:10px 0}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="auth">
  <h2>Login</h2>
  <input id="user" placeholder="User">
  <input id="pass" type="password" placeholder="Pass">
  <button onclick="login()">Login</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" style="display:none">
  <div onclick="page('dashboard')">Dashboard</div>
  <div onclick="page('products')">Products</div>
  <div onclick="page('sales')">Sales</div>
  <div onclick="page('ledger')">Ledger</div>
  <div onclick="page('reports')">Reports</div>
  <div onclick="page('gst')">GST</div>
</div>

<div class="main" id="app" style="display:none">

<!-- DASHBOARD -->
<div id="dashboard" class="page">
  <h2>Dashboard</h2>
  Revenue: ₹<span id="rev">0</span>
</div>

<!-- PRODUCTS -->
<div id="products" class="page" style="display:none">
  <h2>Products</h2>
  <input id="pname" placeholder="Name">
  <input id="pprice" placeholder="Price">
  <button onclick="addProduct()">Add</button>
  <div id="plist"></div>
</div>

<!-- SALES -->
<div id="sales" class="page" style="display:none">
  <h2>Sales</h2>
  <select id="sproduct"></select>
  <input id="sqty" placeholder="Qty">
  <button onclick="addSale()">Sell</button>
  <div id="saleslist"></div>
</div>

<!-- LEDGER -->
<div id="ledger" class="page" style="display:none">
  <h2>Ledger</h2>
  <div id="ledgerData"></div>
</div>

<!-- REPORTS -->
<div id="reports" class="page" style="display:none">
  <h2>Reports</h2>
  <button onclick="showPL()">P&L</button>
  <button onclick="showBS()">Balance Sheet</button>
  <div id="report"></div>
</div>

<!-- GST -->
<div id="gst" class="page" style="display:none">
  <h2>GST</h2>
  <button onclick="gstr1()">GSTR1</button>
  <button onclick="gstr3b()">GSTR3B</button>
  <pre id="gstout"></pre>
</div>

</div>

<script>

/* AUTH */
function login(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('sidebar').style.display='block';
}

/* NAV */
function page(p){
  document.querySelectorAll('.page').forEach(x=>x.style.display='none');
  document.getElementById(p).style.display='block';
}

/* DATA */
let products = JSON.parse(localStorage.products||"[]");
let sales = JSON.parse(localStorage.sales||"[]");
let ledger = [];

/* PRODUCTS */
function addProduct(){
  let p={name:pname.value,price:+pprice.value,gst:18};
  products.push(p);
  localStorage.products=JSON.stringify(products);
  renderProducts();
}

function renderProducts(){
  plist.innerHTML=products.map(p=>p.name+" ₹"+p.price).join("<br>");
  sproduct.innerHTML=products.map(p=>`<option>${p.name}</option>`);
}
renderProducts();

/* SALES + ACCOUNTING */
function addSale(){
  let name=sproduct.value;
  let qty=+sqty.value;
  let p=products.find(x=>x.name==name);

  let subtotal=p.price*qty;
  let gst=subtotal*0.18;
  let total=subtotal+gst;

  sales.push({name,qty,subtotal,gst,total});
  localStorage.sales=JSON.stringify(sales);

  /* VOUCHER ENTRY */
  ledger.push({debit:"Cash",credit:"Sales",amt:subtotal});
  ledger.push({debit:"Cash",credit:"GST Output",amt:gst});

  renderSales();
  updateDashboard();
}

function renderSales(){
  saleslist.innerHTML=sales.map(s=>s.name+" ₹"+s.total).join("<br>");
}
renderSales();

/* DASHBOARD */
function updateDashboard(){
  let rev=sales.reduce((a,b)=>a+b.total,0);
  document.getElementById('rev').innerText=rev;
}
updateDashboard();

/* LEDGER */
function showLedger(){
  ledgerData.innerHTML=ledger.map(e=>
    `${e.debit} → ${e.credit} ₹${e.amt}`
  ).join("<br>");
}
document.getElementById('ledger').onclick=showLedger;

/* REPORTS */
function showPL(){
  let income=sales.reduce((a,b)=>a+b.subtotal,0);
  let gst=sales.reduce((a,b)=>a+b.gst,0);

  report.innerHTML=`Income: ₹${income}<br>GST: ₹${gst}`;
}

function showBS(){
  let cash=sales.reduce((a,b)=>a+b.total,0);
  report.innerHTML=`Assets (Cash): ₹${cash}`;
}

/* GST */
function gstr1(){
  gstout.textContent=JSON.stringify(sales,null,2);
}

function gstr3b(){
  let gst=sales.reduce((a,b)=>a+b.gst,0);
  gstout.textContent="Total GST: "+gst;
}

</script>
</body>
</html>
